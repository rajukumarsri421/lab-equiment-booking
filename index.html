<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Equipment Booking</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1, h2 {
      text-align: center;
      color: #333;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    ul {
      padding-left: 0;
      list-style-type: none;
    }
    li {
      background: #e0e0e0;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lab Equipment Booking</h1>

    <input type="text" id="name" placeholder="Enter your name" />
    
    <select id="equipment">
      <option value="">Select Equipment</option>
      <option value="UTM">UTM</option>
      <option value="pH Meter">pH Meter</option>
      <option value="Oven">Oven</option>
      <option value="Balance">Balance</option>
      <option value="Microscope">Microscope</option>
    </select>
    
    <input type="date" id="date" />
    
    <button onclick="bookEquipment()">Book Equipment</button>

    <h2>All Bookings</h2>
    <ul id="bookingList"></ul>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC_ni6VmxU4TSIdzuz5qKdwBmkVpiDHAr0",
      authDomain: "labequipmentbooking-308d4.firebaseapp.com",
      databaseURL: "https://labequipmentbooking-308d4-default-rtdb.firebaseio.com",
      projectId: "labequipmentbooking-308d4",
      storageBucket: "labequipmentbooking-308d4.appspot.com",
      messagingSenderId: "973079177593",
      appId: "1:973079177593:web:fe9c1225fd19fbca78e7a8",
      measurementId: "G-32YLETLXML"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function bookEquipment() {
      const name = document.getElementById('name').value.trim();
      const equipment = document.getElementById('equipment').value;
      const date = document.getElementById('date').value;

      if (!name || !equipment || !date) {
        alert("Please fill in all fields.");
        return;
      }

      const bookingRef = db.ref("bookings");
      const key = equipment + "_" + date;

      bookingRef.child(key).once("value", (snapshot) => {
        if (snapshot.exists()) {
          alert("This equipment is already booked on that date.");
        } else {
          bookingRef.child(key).set({ name, equipment, date });
          alert("Booking successful!");
          document.getElementById('name').value = '';
          document.getElementById('equipment').value = '';
          document.getElementById('date').value = '';
        }
      });
    }

    function displayBookings() {
      const bookingRef = db.ref("bookings");
      const list = document.getElementById("bookingList");
      list.innerHTML = "";

      bookingRef.on("value", (snapshot) => {
        list.innerHTML = "";
        snapshot.forEach((child) => {
          const b = child.val();
          const li = document.createElement("li");
          li.textContent = `${b.equipment} booked by ${b.name} on ${b.date}`;
          list.appendChild(li);
        });
      });
    }

    window.onload = displayBookings;
  </script>
</body>
</html>
