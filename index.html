<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Equipment Booking</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1, h2 {
      text-align: center;
      color: #333;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    ul {
      padding-left: 0;
      list-style-type: none;
    }
    li {
      background: #e0e0e0;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lab Equipment Booking</h1>

    <input type="text" id="name" placeholder="Enter your name" />
    
    <select id="equipment">
      <option value="">Select Equipment</option>
      <option value="UTM">UTM</option>
      <option value="pH Meter">pH Meter</option>
      <option value="Oven">Oven</option>
      <option value="Balance">Balance</option>
      <option value="Microscope">Microscope</option>
    </select>
    
    <input type="date" id="date" />
    
    <button onclick="bookEquipment()">Book Equipment</button>

    <h2>All Bookings</h2>
    <ul id="bookingList"></ul>
  </div>

  <script>
    const bookings = [];

    function bookEquipment() {
      const name = document.getElementById('name').value.trim();
      const equipment = document.getElementById('equipment').value;
      const date = document.getElementById('date').value;

      if (!name || !equipment || !date) {
        alert("Please fill in all fields.");
        return;
      }

      const duplicate = bookings.find(
        (b) => b.equipment === equipment && b.date === date
      );

      if (duplicate) {
        alert("This equipment is already booked on that date.");
        return;
      }

      bookings.push({ name, equipment, date });
      displayBookings();
      alert("Booking successful!");

      // Clear fields
      document.getElementById('name').value = '';
      document.getElementById('equipment').value = '';
      document.getElementById('date').value = '';
    }

    function displayBookings() {
      const list = document.getElementById('bookingList');
      list.innerHTML = '';
      bookings.forEach((b) => {
        const li = document.createElement('li');
        li.textContent = `${b.equipment} booked by ${b.name} on ${b.date}`;
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
